# 本仓仅用于 R2 上传鉴权与本站资源绑定参考。
# 共享入口 Worker 名为 allworld；日常发布请用 `npm run deploy`（只写本站 R2 前缀），
# 切勿随意 `wrangler deploy` 覆盖共享 Worker，以免影响其他站点。
name = "allworld"
compatibility_date = "2026-09-03"
compatibility_flags = ["nodejs_compat"]
account_id = "57df712874237f41c6142eb723be3f21"
workers_dev = true

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "yz-fire-risk-assets"

[[r2_buckets]]
binding = "SITES"
bucket_name = "allworld-sites"

[vars]
APP_NAME = "扬州市消防救援支队火灾风险研判和隐患治理决策辅助系统"
PROJECT_SLUG = "yz-fire-risk"
REPO_NAME = "yz-fire-risk"
SITE_SLUG = "yz-fire-risk"
DEPLOYMENT_HOST = "https://yz-fire-risk.softwarelink.net/"
HOST_DOMAIN = "https://yz-fire-risk.softwarelink.net"
ROOT_DOMAIN = "softwarelink.net"
SITE_HOST = "https://yz-fire-risk.softwarelink.net/"
TABLE_PREFIX = "yz_"
R2_SITE_PREFIX = "allworld-sites/yz-fire-risk/"
